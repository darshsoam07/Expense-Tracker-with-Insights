<!-- Darsh Financial Dashboard: clean premium finance interface using Flask, Tailwind CSS, Chart.js, and vanilla JavaScript. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f8f3" />
    <meta name="description" content="Darsh Financial Dashboard — Track expenses, visualize spending patterns, and export financial reports." />
    <title>{% block title %}Darsh Financial Dashboard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['DM Sans', 'system-ui', 'sans-serif'] },
            colors: {
              page:       '#F4F8F3',
              surface:    '#FFFFFF',
              'surface-2':'#F7FAF6',
              'surface-3':'#EFF5EE',
              ink:        '#172019',
              'ink-2':    '#3A4A3E',
              'ink-3':    '#758078',
              'ink-4':    '#9DA89F',
              border:     '#E4EAE3',
              'border-2': '#D6DDD5',
              accent:     '#1F8F45',
              'accent-light':'#DDF2E1',
              'accent-pale':'#EDF7EF',
              'accent-dark':'#176B34',
              danger:     '#D95656',
              'danger-light':'#FDEAEA',
              warning:    '#E4A72C',
            },
            borderRadius: { xl: '14px', '2xl': '18px', '3xl': '22px' },
            boxShadow: {
              card: '0 1px 3px rgba(23,32,25,.06), 0 6px 16px rgba(23,32,25,.04)',
              'card-hover': '0 2px 6px rgba(23,32,25,.08), 0 10px 24px rgba(23,32,25,.06)',
              modal: '0 8px 40px rgba(23,32,25,.18)',
            },
          },
        },
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  </head>
  <body class="bg-page text-ink">
    {% block content %}{% endblock %}
    <script>document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>
  </body>
</html>
