# Minimal CI (PR 2). Lint, types, architecture boundaries and tests for the backend.
# Image build, vulnerability/secret scanning and deployment arrive in later PRs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the repository. No write access, no secrets.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, architecture, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      # Actions are pinned to full commit SHAs (the comment shows the release), so a moved
      # or compromised tag cannot silently change what runs.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/constraints.txt
            backend/pyproject.toml

      - name: Install dependencies (pinned by constraints.txt)
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatting (ruff format --check)
        run: ruff format --check .

      - name: Type check (mypy, strict)
        run: mypy

      - name: Architecture boundaries (import-linter)
        run: lint-imports

      - name: Tests (pytest, coverage must be at least 85%)
        run: pytest
