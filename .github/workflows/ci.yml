# Minimal CI (PR 2). Lint, types, architecture boundaries and tests for the backend.
# Image build, vulnerability/secret scanning and deployment arrive in later PRs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the repository. No write access, no secrets.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, architecture, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      # Actions are pinned to full commit SHAs (the comment shows the release), so a moved
      # or compromised tag cannot silently change what runs.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/constraints.txt
            backend/pyproject.toml

      - name: Install dependencies (pinned by constraints.txt)
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatting (ruff format --check)
        run: ruff format --check .

      - name: Type check (mypy, strict)
        run: mypy

      - name: Architecture boundaries (import-linter)
        run: lint-imports

      - name: Tests (pytest, coverage must be at least 85%)
        run: pytest

  postgres:
    name: PostgreSQL 17 foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python scripts/init_compose.py
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: docker compose stop backend
      - run: docker compose run --rm --no-deps --volume "$PWD/backend/tests/verify_postgres.py:/app/verify_postgres.py:ro" bootstrap python verify_postgres.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build (vite build)
        run: npm run build
