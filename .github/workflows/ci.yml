# Minimal CI (PR 2). Lint, types, architecture boundaries and tests for the backend.
# Image build, vulnerability/secret scanning and deployment arrive in later PRs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the repository. No write access, no secrets.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, architecture, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A real PostgreSQL 17 server, same major version as Compose, for the integration tests.
    # Throw-away credentials; the database exists only for this job.
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_DB: ledgerops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgerops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:ci-admin-password@localhost:5432/ledgerops
      MIGRATION_PASSWORD: ci-migration-password
      RUNTIME_PASSWORD: ci-runtime-password
      MIGRATION_DATABASE_URL: postgresql+psycopg://ledgerops_migrator:ci-migration-password@localhost:5432/ledgerops
      TEST_DATABASE_URL: postgresql+psycopg://ledgerops_runtime:ci-runtime-password@localhost:5432/ledgerops
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://ledgerops_migrator:ci-migration-password@localhost:5432/ledgerops
      # A missing database must fail the build, not silently skip the integration tests.
      REQUIRE_DATABASE_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      # Actions are pinned to full commit SHAs (the comment shows the release), so a moved
      # or compromised tag cannot silently change what runs.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/constraints.txt
            backend/pyproject.toml

      - name: Install dependencies (pinned by constraints.txt)
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatting (ruff format --check)
        run: ruff format --check .

      - name: Type check (mypy, strict)
        run: mypy

      - name: Architecture boundaries (import-linter)
        run: lint-imports

      - name: Create database roles and migrate to head
        run: |
          python -m app.db.bootstrap
          alembic upgrade head

      - name: Tests (PostgreSQL ledger and hold invariants, coverage must be at least 85%)
        run: pytest

  postgres:
    name: PostgreSQL 17 foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python scripts/init_compose.py
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: docker compose stop backend
      - run: docker compose run --rm --no-deps --volume "$PWD/backend/tests/verify_postgres.py:/app/verify_postgres.py:ro" bootstrap python verify_postgres.py
      - name: Verify financial workflows against the round-tripped Compose database
        run: |
          docker compose run --rm --no-deps -T \
            --volume "$PWD/backend/tests:/app/tests:ro" bootstrap sh -ec '
              python -m venv --system-site-packages /tmp/hold-tests
              /tmp/hold-tests/bin/pip install -q -c constraints.txt pytest pytest-cov httpx2
              export TEST_DATABASE_URL="postgresql+psycopg://ledgerops_runtime:${RUNTIME_PASSWORD}@database/ledgerops"
              export TEST_MIGRATION_DATABASE_URL="postgresql+psycopg://ledgerops_migrator:${MIGRATION_PASSWORD}@database/ledgerops"
              export REQUIRE_DATABASE_TESTS=1
              /tmp/hold-tests/bin/python -m pytest -p no:cacheprovider --no-cov tests/integration/test_holds.py tests/integration/test_payments.py
            '
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build (vite build)
        run: npm run build

  windows:
    name: Windows compatibility (backend non-DB checks & frontend)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/constraints.txt
            backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Backend lint (ruff check)
        working-directory: backend
        run: ruff check .

      - name: Backend formatting (ruff format --check)
        working-directory: backend
        run: ruff format --check .

      - name: Backend type check (mypy, strict)
        working-directory: backend
        run: mypy

      - name: Backend architecture boundaries (import-linter)
        working-directory: backend
        run: lint-imports

      - name: Backend unit tests (pytest -m "not integration" --no-cov)
        working-directory: backend
        run: pytest -m "not integration" --no-cov

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend type check (tsc --noEmit)
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend unit tests (vitest)
        working-directory: frontend
        run: npm test

      - name: Frontend production build (vite build)
        working-directory: frontend
        run: npm run build
